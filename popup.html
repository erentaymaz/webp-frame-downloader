<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>WebP Frame Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="icons/icon32.png" alt="" class="header__icon" width="24" height="24">
    <div>
      <h1 class="header__title">WebP Frame Downloader</h1>
      <p class="header__subtitle">Sıralı animasyon karelerini toplu indir</p>
    </div>
  </header>

  <main>
    <!-- 1) Sayfa taraması -->
    <section class="card">
      <div class="card__head">
        <h2 class="card__title">Sayfa taraması</h2>
        <div class="row">
          <button id="rescanBtn" class="btn btn--ghost btn--small" type="button">Yeniden tara</button>
          <button id="deepScanBtn" class="btn btn--secondary btn--small" type="button"
                  title="Sayfayı yeniler, otomatik kaydırır ve tüm kareleri yakalar">Derin tara</button>
        </div>
      </div>
      <p id="scanStatus" class="muted">Taranıyor…</p>
      <select id="sequenceSelect" class="input" hidden></select>
    </section>

    <!-- 2) URL ile analiz: sayfa adresi veya tek bir frame adresi -->
    <section class="card">
      <h2 class="card__title">URL ile analiz</h2>
      <form id="urlForm" class="row">
        <input id="urlInput" class="input" type="url" required
               placeholder="Sayfa adresi veya …/frame_0202.webp" spellcheck="false">
        <button class="btn btn--secondary" type="submit">Analiz et</button>
      </form>
      <p id="urlError" class="error" hidden></p>
    </section>

    <!-- 3) Seçili dizi ve aralık -->
    <section id="sequenceCard" class="card" hidden>
      <h2 class="card__title">Frame dizisi</h2>
      <p class="pattern"><code id="patternText"></code></p>
      <p id="foundText" class="muted"></p>
      <p id="detectText" class="muted small" hidden></p>

      <div class="range">
        <label class="field">
          <span>Başlangıç</span>
          <input id="startInput" class="input" type="number" min="0" step="1">
        </label>
        <label class="field">
          <span>Bitiş</span>
          <input id="endInput" class="input" type="number" min="0" step="1">
        </label>
      </div>
      <p id="rangeInfo" class="muted small"></p>

      <button id="pickFolderBtn" class="btn btn--primary btn--block" type="button">Klasör seçip indir…</button>
      <button id="downloadBtn" class="btn btn--secondary btn--block" type="button">İndirilenler/animation_frames'e indir</button>
    </section>

    <!-- 4) İlerleme -->
    <section id="progressCard" class="card" hidden>
      <div class="card__head">
        <h2 class="card__title">İndirme</h2>
        <span id="progressText" class="progress__text">0 / 0</span>
      </div>
      <div class="progress"><div id="progressBar" class="progress__bar"></div></div>
      <div class="card__head">
        <p id="progressInfo" class="muted small"></p>
        <button id="cancelBtn" class="btn btn--ghost btn--small" type="button">İptal</button>
      </div>
    </section>
  </main>

  <script src="frames.js"></script>
  <script src="scanner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
